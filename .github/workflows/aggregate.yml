name: Build feed

on:
  schedule:
    - cron: "0 7,19 * * *"   # twice daily, UTC
  workflow_dispatch:          # manual run button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python aggregate.py
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}

      - name: Commit updated feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/feed.json docs/feed.xml
          git diff --staged --quiet || git commit -m "Update feed $(date -u +%F_%H:%M)"
          git push
